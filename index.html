<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Book Service - ClearClick Pool Care</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-4">

    <!-- Header -->
    <div class="max-w-md mx-auto text-center my-6 space-y-2">
        <div class="w-12 h-12 bg-cyan-500 rounded-2xl flex items-center justify-center text-slate-900 font-bold text-2xl shadow-lg shadow-cyan-500/30 mx-auto">
            <i class="fa-solid fa-water"></i>
        </div>
        <h1 class="text-xl font-bold tracking-tight text-white">ClearClick Pool Care</h1>
        <p class="text-xs text-cyan-400 font-medium">Rocklin & Roseville Premium Service</p>
    </div>

    <!-- Main Booking Card -->
    <main class="max-w-md mx-auto bg-slate-800/80 rounded-2xl p-5 border border-slate-700/60 shadow-xl space-y-5">
        
        <div class="bg-gradient-to-r from-cyan-600 to-blue-600 rounded-xl p-4 text-white">
            <h2 class="text-lg font-extrabold">New Client Onboarding</h2>
            <p class="text-xs text-cyan-100 mt-1">Book your free pool inspection & setup weekly service in 60 seconds.</p>
        </div>

        <form onsubmit="alert('🎉 Thank you! ClearClick received your booking. We will text you shortly!'); return false;" class="space-y-4">
            
            <!-- Step 1 -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-cyan-400 uppercase tracking-wider">1. Service Address</label>
                <input type="text" placeholder="Street Address, Rocklin / Roseville" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-cyan-400">
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" placeholder="Your Name" required class="bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-cyan-400">
                    <input type="tel" placeholder="Phone Number" required class="bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-cyan-400">
                </div>
            </div>

            <hr class="border-slate-700">

            <!-- Step 2 -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-cyan-400 uppercase tracking-wider">2. Pool System Type</label>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <label class="bg-slate-900 p-3 rounded-xl border border-slate-700 flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="sys" checked class="accent-cyan-400">
                        <span>Saltwater System</span>
                    </label>
                    <label class="bg-slate-900 p-3 rounded-xl border border-slate-700 flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="sys" class="accent-cyan-400">
                        <span>Chlorine Pool</span>
                    </label>
                </div>
            </div>

            <hr class="border-slate-700">

            <!-- Step 3 -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-cyan-400 uppercase tracking-wider">3. Preferred First Service Date</label>
                <input type="date" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-cyan-400">
            </div>

            <button type="submit" class="w-full py-3.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold text-sm rounded-xl shadow-lg shadow-cyan-500/20 transition mt-2">
                Schedule First Inspection 🚀
            </button>

        </form>
    </main>

    <footer class="text-center text-[10px] text-slate-500 my-6">
        © ClearClick Pool Care • Rocklin, CA
    </footer>

</body>
</html>
